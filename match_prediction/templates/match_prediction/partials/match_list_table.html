<div class="overflow-x-auto bg-white shadow rounded-2xl">
    <table class="min-w-full table-auto text-sm">
        <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-left font-medium text-gray-700">#</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Match</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Date & Time</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Venue</th>
                <th class="px-6 py-3 text-left font-medium text-gray-700">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for match in matches %}
            <tr class="border-t hover:bg-gray-50" id="match-row-{{ match.id }}">
                <td class="px-6 py-3">{{ forloop.counter }}</td>
                <td class="px-6 py-3 font-semibold text-blue-600">
                    <a href="{% url 'match_prediction:match_detail' match.id %}"
                       class="hover:underline">{{ match.title }}</a> </td>
                <td class="px-6 py-3">{{ match.match_datetime|date:"M d, Y H:i" }}</td>
                <td class="px-6 py-3">{{ match.venue }}</td>
                <td class="px-6 py-3">
                    {% if can_manage_matches %}
                    <button
                        type="button"
                        class="editMatchBtn text-yellow-500 hover:text-yellow-600 mr-3"
                        data-ajax-url="{% url 'match_prediction:match_edit' match.id %}"
                        >Edit</button>
                    <button
                        type="button"
                        class="deleteMatchBtn text-red-500 hover:text-red-600"
                        data-delete-url="{% url 'match_prediction:match_delete' match.id %}"
                        >Delete</button>
                    {% else %}
                    <span class="text-gray-400 italic">View only</span>
                    {% endif %}
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="px-6 py-4 text-center text-gray-500">No matches available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
