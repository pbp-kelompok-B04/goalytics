{# templates/match_prediction/match_detail.html #}
{% extends 'base.html' %}
{% load static %}
{% block title %}Match Forums{% endblock %}

{% block content %}
<section class="w-full px-4 py-6 sm:px-8 lg:px-12">
  <div class="mx-auto flex w-full max-w-6xl flex-col gap-8">
    <header class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
      <div class="space-y-2">
        <h1 class="text-3xl font-semibold text-slate-900 md:text-4xl">Match Forums</h1>
        <p class="max-w-xl text-base text-slate-500 md:text-lg"></p>
      </div>

      {% if can_manage_matches %}
      <div class="flex items-center gap-3">
        <button
          id="add-match-btn"
          data-ajax-url="{% url 'match_prediction:match_create' %}"
          type="button"
          class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-6 py-2.5 text-sm font-semibold text-white shadow-lg transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-300">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m7-7H5" />
          </svg>
          Add Match
        </button>
      </div>
      {% endif %}
    </header>

    <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <div id="match-list">
        {% include 'match_prediction/partials/match_list_table.html' %}
      </div>
    </div>
  </div>
</section>


{% endblock %}
