{% extends 'base.html' %}

{% block content %}

<!-- Main Content -->
<main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Back Button -->
    <div class="mb-6">
        <button onclick="window.location.href='{% url 'forum_home' %}'" class="flex items-center gap-2 text-gray-600 hover:text-blue-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Forum
        </button>
    </div>

    <!-- Post Content -->
    <div id="post-detail" class="bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm">
        <!-- Post will be loaded here -->
        <div class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-500">Loading post...</p>
        </div>
    </div>

    <!-- Comments Section -->
    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-800">Comments</h2>
            <span id="comment-count" class="text-sm text-gray-500"></span>
        </div>

        <!-- Comment Form -->
        <form id="commentForm" class="mb-6 pb-6 border-b border-gray-200">
            <textarea id="commentContent" rows="3" placeholder="Share your thoughts..." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none mb-3"></textarea>
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2 rounded-lg transition-all duration-300 shadow">
                Add Comment
            </button>
        </form>

        <!-- Comments List -->
        <div id="comments-list" class="space-y-4">
            <!-- Comments will be loaded here -->
        </div>
    </div>
</main>

<!-- Reply Modal -->
<div id="replyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full border border-gray-200 shadow-lg">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-700">Reply to Comment</h2>
            <button onclick="closeReplyModal()" class="text-gray-400 hover:text-gray-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form id="replyForm" class="p-6 space-y-4">
            <input type="hidden" id="replyParentId">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Your Reply</label>
                <textarea id="replyContent" rows="4" placeholder="Write your reply..." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-lg transition-all duration-300 shadow">
                    Reply
                </button>
                <button type="button" onclick="closeReplyModal()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Comment Modal -->
<div id="editCommentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full border border-gray-200 shadow-lg">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-700">Edit Comment</h2>
            <button onclick="closeEditCommentModal()" class="text-gray-400 hover:text-gray-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form id="editCommentForm" class="p-6 space-y-4">
            <textarea id="editCommentContent" rows="4" placeholder="Update your comment..." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            <div class="flex gap-3 justify-end">
                <button type="button" onclick="closeEditCommentModal()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors">
                    Cancel
                </button>
                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Comment Modal -->
<div id="deleteCommentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl w-full max-w-md border border-gray-200 shadow-lg">
        <div class="px-6 py-5">
            <h3 class="text-xl font-bold text-gray-900 mb-2">Delete Comment</h3>
            <p class="text-gray-600">Are you sure you want to delete this comment? This action cannot be undone.</p>
            <div class="flex flex-col sm:flex-row sm:justify-end gap-3 mt-6">
                <button type="button" onclick="closeDeleteCommentModal()" class="px-5 py-2.5 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 transition-colors">
                    Cancel
                </button>
                <button type="button" onclick="confirmDeleteComment()" class="px-5 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold shadow transition-colors">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed top-20 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden items-center gap-3 z-50 animate-slide-in">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    <span id="toastMessage">Success!</span>
</div>

<style>
    @keyframes slide-in {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    .animate-slide-in {
        animation: slide-in 0.3s ease-out;
    }
</style>

<script>
    const postId = "{{ post_id }}";
    const postUrl = "{% url 'get_post_by_id' post_id %}";
    const commentsUrl = "{% url 'get_post_comment' post_id %}";
    const createCommentUrl = "{% url 'create_comment' post_id %}";
    const editCommentModal = document.getElementById('editCommentModal');
    const deleteCommentModal = document.getElementById('deleteCommentModal');
    const editCommentForm = document.getElementById('editCommentForm');
    const editCommentTextarea = document.getElementById('editCommentContent');
    const commentCache = new Map();
    let editCommentTargetId = null;
    let deleteCommentTargetId = null;

    function resolveAvatar(name, provided) {
        if (provided) {
            return provided;
        }
        const fallbackName = (name || 'User').trim() || 'User';
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(fallbackName)}`;
    }

    // Get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Toast function
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toastMessage.textContent = message;
        
        if (isError) {
            toast.classList.remove('bg-green-500');
            toast.classList.add('bg-red-500');
        } else {
            toast.classList.remove('bg-red-500');
            toast.classList.add('bg-green-500');
        }
        
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        
        setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
        }, 3000);
    }

    // Reply Modal functions
    function openReplyModal(parentId) {
        document.getElementById('replyParentId').value = parentId;
        document.getElementById('replyModal').classList.remove('hidden');
        document.getElementById('replyModal').classList.add('flex');
    }

    function closeReplyModal() {
        document.getElementById('replyModal').classList.add('hidden');
        document.getElementById('replyModal').classList.remove('flex');
        document.getElementById('replyForm').reset();
    }

    function openEditCommentModal(commentId) {
        const data = commentCache.get(commentId);
        if (!data) {
            showToast('Unable to load comment for editing', true);
            return;
        }
        editCommentTargetId = commentId;
        if (editCommentTextarea) {
            editCommentTextarea.value = data.content || '';
        }
        if (editCommentModal) {
            editCommentModal.classList.remove('hidden');
            editCommentModal.classList.add('flex');
        }
    }

    function closeEditCommentModal() {
        if (editCommentModal) {
            editCommentModal.classList.add('hidden');
            editCommentModal.classList.remove('flex');
        }
        editCommentTargetId = null;
        if (editCommentTextarea) {
            editCommentTextarea.value = '';
        }
    }

    function openDeleteCommentModal(commentId) {
        deleteCommentTargetId = commentId;
        if (deleteCommentModal) {
            deleteCommentModal.classList.remove('hidden');
            deleteCommentModal.classList.add('flex');
        }
    }

    function closeDeleteCommentModal() {
        if (deleteCommentModal) {
            deleteCommentModal.classList.add('hidden');
            deleteCommentModal.classList.remove('flex');
        }
        deleteCommentTargetId = null;
    }

    async function submitEditComment(event) {
        event.preventDefault();
        if (!editCommentTargetId) {
            closeEditCommentModal();
            showToast('No comment selected for editing', true);
            return;
        }
        const newContent = (editCommentTextarea.value || '').trim();
        if (!newContent) {
            showToast('Comment cannot be empty', true);
            return;
        }
        try {
            const response = await fetch(`/forum/api/comments/${editCommentTargetId}/update/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({
                    _method: 'PATCH',
                    post_id: postId,
                    comment_id: editCommentTargetId,
                    content: newContent
                })
            });
            const result = await response.json();
            if (response.ok) {
                showToast('Comment updated successfully!');
                closeEditCommentModal();
                loadComments();
            } else {
                showToast(result.error || 'Error updating comment', true);
            }
        } catch (error) {
            console.error('Error updating comment:', error);
            showToast('Error updating comment', true);
        }
    }

    async function confirmDeleteComment() {
        if (!deleteCommentTargetId) {
            closeDeleteCommentModal();
            showToast('No comment selected for deletion', true);
            return;
        }
        try {
            const response = await fetch(`/forum/api/comments/${deleteCommentTargetId}/delete/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({
                    _method: 'DELETE',
                    post_id: postId,
                    comment_id: deleteCommentTargetId
                })
            });
            const result = await response.json();
            if (response.ok) {
                showToast('Comment deleted successfully!');
                closeDeleteCommentModal();
                loadComments();
                loadPost();
            } else {
                showToast(result.error || 'Error deleting comment', true);
            }
        } catch (error) {
            console.error('Error deleting comment:', error);
            showToast('Error deleting comment', true);
        }
    }

    // Load post detail
    async function loadPost() {
        try {
            const response = await fetch(postUrl, { credentials: 'include' });
            if (!response.ok) {
                throw new Error('Failed to load post');
            }
            const result = await response.json();
            if (!result || !result.data) {
                throw new Error('Invalid post payload');
            }
            displayPost(result.data);
        } catch (error) {
            console.error('Error loading post:', error);
            document.getElementById('post-detail').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-red-500">Error loading post. Please try again.</p>
                </div>
            `;
        }
    }

    // Display post
    function displayPost(post) {
        const date = new Date(post.created_at);
        const timeAgo = getTimeAgo(date);
        const leagueNames = {
            'EPL': 'Premier League',
            'LALIGA': 'La Liga',
            'SERIEA': 'Serie A',
            'BUNDES': 'Bundesliga',
            'LIGUE1': 'Ligue 1'
        };
        const leagueLabel = leagueNames[post.league] || 'General';

        document.getElementById('post-detail').innerHTML = `
            <div class="flex items-start gap-4">
                <img src="${resolveAvatar(post.author, post.avatar)}" alt="${post.author}" class="flex-shrink-0 w-12 h-12 rounded-full object-cover border border-blue-200" loading="lazy" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author || 'User')}';">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="font-semibold text-gray-900">${post.author}</span>
                        <span class="text-gray-400">&middot;</span>
                        <span class="text-xs px-2 py-1 bg-blue-50 text-blue-600 border border-blue-100 rounded-full">${leagueLabel}</span>
                        <span class="text-gray-400">&middot;</span>
                        <span class="text-sm text-gray-500">${timeAgo}</span>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-4">${escapeHtml(post.title)}</h1>
                    <p class="text-gray-700 text-base leading-relaxed whitespace-pre-wrap">${escapeHtml(post.content)}</p>
                </div>
            </div>
        `;
        
        const commentTotal = post.comment_count || 0;
        document.getElementById('comment-count').textContent = `${commentTotal} comments`;
    }

    // Load comments
    async function loadComments() {
        try {
            const response = await fetch(commentsUrl, { credentials: 'include' });
            if (!response.ok) {
                throw new Error('Failed to load comments');
            }
            const result = await response.json();
            displayComments((result && result.data) || []);
        } catch (error) {
            console.error('Error loading comments:', error);
            document.getElementById('comments-list').innerHTML = `
                <div class="text-center py-8">
                    <p class="text-red-500">Error loading comments.</p>
                </div>
            `;
        }
    }

    // Display comments
    function renderComment(comment, depth = 0) {
        const date = new Date(comment.created_at);
        const timeAgo = getTimeAgo(date);
        const indentClass = depth > 0 ? 'ml-8 border-l border-gray-200 pl-6' : '';
        const hasReplies = Array.isArray(comment.replies) && comment.replies.length > 0;
        commentCache.set(comment.id, { content: comment.content });

        const childHtml = hasReplies
            ? `
                <div class="mt-3">
                    <button type="button"
                            id="toggle-btn-${comment.id}"
                            onclick="toggleReplies(${comment.id})"
                            class="text-xs uppercase tracking-wide text-blue-600 hover:text-blue-500 font-semibold">
                        Hide replies (${comment.replies.length})
                    </button>
                </div>
                <div id="replies-${comment.id}" data-count="${comment.replies.length}" class="mt-4 space-y-4">
                    ${comment.replies.map(child => renderComment(child, depth + 1)).join('')}
                </div>
            `
            : '';

        const ownerActions = comment.is_owner ? `
            <button type="button"
                    onclick="openEditCommentModal(${comment.id})"
                    class="text-blue-600 hover:text-blue-500 font-medium inline-flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                Edit
            </button>
            <button type="button"
                    onclick="openDeleteCommentModal(${comment.id})"
                    class="text-red-600 hover:text-red-500 font-medium inline-flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                Delete
            </button>
        ` : '';

        return `
            <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm ${indentClass}">
                <div class="flex items-start gap-3">
                    <img src="${resolveAvatar(comment.user, comment.avatar)}" alt="${comment.user}" class="flex-shrink-0 w-10 h-10 rounded-full object-cover border border-blue-200" loading="lazy" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(comment.user || 'User')}';">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="font-semibold text-gray-900">${comment.user}</span>
                            <span class="text-gray-400">&middot;</span>
                            <span class="text-sm text-gray-500">${timeAgo}</span>
                        </div>
                        <p class="text-gray-700 mb-3 whitespace-pre-wrap">${escapeHtml(comment.content)}</p>
                        <div class="flex items-center flex-wrap gap-3 text-sm text-gray-500">
                            <button type="button" onclick="openReplyModal(${comment.id})" class="text-blue-600 hover:text-blue-500 font-medium inline-flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                                </svg>
                                Reply
                            </button>
                            ${ownerActions}
                        </div>
                        ${childHtml}
                    </div>
                </div>
            </div>
        `;
    }

    function displayComments(comments) {
        const commentsList = document.getElementById('comments-list');
        commentCache.clear();

        if (!comments || comments.length === 0) {
            commentsList.innerHTML = `
                <div class="text-center py-8">
                    <p class="text-gray-500">No comments yet. Be the first to comment!</p>
                </div>
            `;
            return;
        }

        commentsList.innerHTML = comments.map(comment => renderComment(comment)).join('');
    }

    function toggleReplies(commentId) {
        const container = document.getElementById(`replies-${commentId}`);
        const button = document.getElementById(`toggle-btn-${commentId}`);
        if (!container || !button) {
            return;
        }
        const hidden = container.classList.toggle('hidden');
        const count = container.dataset.count || container.children.length;
        button.textContent = hidden ? `Show replies (${count})` : `Hide replies (${count})`;
    }
    // Add comment
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const content = document.getElementById('commentContent').value.trim();
        
        if (!content) {
            showToast('Please enter a comment', true);
            return;
        }
        
        try {
            const response = await fetch(createCommentUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ content })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showToast('Comment added successfully!');
                document.getElementById('commentContent').value = '';
                loadComments();
                loadPost(); // Reload post to update comment count
            } else {
                showToast(result.error || 'Error adding comment', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error adding comment', true);
        }
    });

    // Add reply
    document.getElementById('replyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const content = document.getElementById('replyContent').value.trim();
        const parentId = document.getElementById('replyParentId').value;
        
        if (!content) {
            showToast('Please enter a reply', true);
            return;
        }
        
        try {
            const response = await fetch(createCommentUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ content, parent_id: parentId })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showToast('Reply added successfully!');
                closeReplyModal();
                loadComments();
                loadPost(); // Reload post to update comment count
            } else {
                showToast(result.error || 'Error adding reply', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error adding reply', true);
        }
    });

    if (editCommentForm) {
        editCommentForm.addEventListener('submit', submitEditComment);
    }

    // Helper functions
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        const intervals = {
            year: 31536000,
            month: 2592000,
            week: 604800,
            day: 86400,
            hour: 3600,
            minute: 60
        };
        
        for (const [key, value] of Object.entries(intervals)) {
            const interval = Math.floor(seconds / value);
            if (interval >= 1) {
                return interval === 1 ? `1 ${key} ago` : `${interval} ${key}s ago`;
            }
        }
        return 'just now';
    }

    // Load data on page load
    loadPost();
    loadComments();
</script>

{% endblock %}
