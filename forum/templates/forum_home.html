{% extends 'base.html' %}

{% block content %}


<!-- Main Content -->
<main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Header with Create Button -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-blue-400">Goalytics Football Forum</h1>
        <div class="flex items-center gap-3">
            <button type="button" id="my-posts-toggle" aria-pressed="false" class="px-4 py-2.5 rounded-full border border-gray-600 bg-gray-700 text-gray-200 hover:bg-gray-600 transition-colors duration-200">
                My Posts
            </button>
            <button onclick="openCreateModal()" class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold px-6 py-2.5 rounded-full transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                Create Post
            </button>
        </div>
    </div>

    <!-- Filter & Sort Section -->
    <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
        <div class="grid gap-4 sm:grid-cols-2">
            <div class="flex flex-col gap-2">
                <label for="league-filter" class="text-sm font-medium text-gray-300">Filter League</label>
                <select id="league-filter" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="">All Leagues</option>
                    <option value="EPL">Premier League</option>
                    <option value="LALIGA">La Liga</option>
                    <option value="SERIEA">Serie A</option>
                    <option value="BUNDES">Bundesliga</option>
                    <option value="LIGUE1">Ligue 1</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label for="sort-order" class="text-sm font-medium text-gray-300">Sort Posts</label>
                <select id="sort-order" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Posts List -->
    <div id="posts-list" class="space-y-4">
        <!-- Posts will be loaded here -->
        <div class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
            <p class="mt-4 text-gray-400">Loading posts...</p>
        </div>
    </div>
</main>

<!-- Create Post Modal -->
<div id="createModal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border-2 border-gray-700 shadow-2xl">
        <div class="sticky top-0 bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-400">Create New Post</h2>
            <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form id="createPostForm" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">League</label>
                <select id="postLeague" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="EPL">Premier League</option>
                    <option value="LALIGA">La Liga</option>
                    <option value="SERIEA">Serie A</option>
                    <option value="BUNDES">Bundesliga</option>
                    <option value="LIGUE1">Ligue 1</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Title</label>
                <input type="text" id="postTitle" placeholder="What's on your mind?" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Content</label>
                <textarea id="postContent" rows="6" placeholder="Share your thoughts..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl">
                    Post
                </button>
                <button type="button" onclick="closeCreateModal()" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-lg transition-colors">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Post Modal -->
<div id="editModal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center z-50 p-4">
    <div class="bg-gray-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border-2 border-gray-700 shadow-2xl">
        <div class="sticky top-0 bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-400">Edit Post</h2>
            <button onclick="closeEditModal()" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form id="editPostForm" class="p-6 space-y-4">
            <input type="hidden" id="editPostId">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">League</label>
                <select id="editPostLeague" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="EPL">Premier League</option>
                    <option value="LALIGA">La Liga</option>
                    <option value="SERIEA">Serie A</option>
                    <option value="BUNDES">Bundesliga</option>
                    <option value="LIGUE1">Ligue 1</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Title</label>
                <input type="text" id="editPostTitle" placeholder="What's on your mind?" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Content</label>
                <textarea id="editPostContent" rows="6" placeholder="Share your thoughts..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl">
                    Update Post
                </button>
                <button type="button" onclick="closeEditModal()" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-lg transition-colors">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed top-20 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden items-center gap-3 z-50 animate-slide-in">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    <span id="toastMessage">Post created successfully!</span>
</div>

<style>
    @keyframes slide-in {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    .animate-slide-in {
        animation: slide-in 0.3s ease-out;
    }
</style>

<script>
    const isAuthenticated = ("{{ request.user.is_authenticated|yesno:'true,false' }}" === "true");
    let currentLeague = '';
    let currentSort = 'newest';
    let showMyPostsOnly = false;
    const listUrl = "{% url 'get_all_post' %}";
    const createUrl = "{% url 'create_post' %}";
    const detailTemplate = "{% url 'forum_post_detail' 0 %}";
    const leagueSelect = document.getElementById('league-filter');
    const sortSelect = document.getElementById('sort-order');
    const myPostsToggle = document.getElementById('my-posts-toggle');

    function resolveAvatar(name, provided) {
        if (provided) {
            return provided;
        }
        const fallbackName = (name || 'User').trim() || 'User';
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(fallbackName)}`;
    }

    // Get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Modal functions
    function openCreateModal() {
        document.getElementById('createModal').classList.remove('hidden');
        document.getElementById('createModal').classList.add('flex');
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.add('hidden');
        document.getElementById('createModal').classList.remove('flex');
        document.getElementById('createPostForm').reset();
    }

    function openEditModal(post) {
        document.getElementById('editPostId').value = post.id;
        document.getElementById('editPostTitle').value = post.title;
        document.getElementById('editPostContent').value = post.content;
        document.getElementById('editPostLeague').value = post.league;
        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
        document.getElementById('editPostForm').reset();
    }

    // Toast function
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toastMessage.textContent = message;
        
        if (isError) {
            toast.classList.remove('bg-green-500');
            toast.classList.add('bg-red-500');
        } else {
            toast.classList.remove('bg-red-500');
            toast.classList.add('bg-green-500');
        }
        
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        
        setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
        }, 3000);
    }

    // Filter by league
    if (leagueSelect) {
        leagueSelect.addEventListener('change', (event) => {
            currentLeague = event.target.value;
            loadPosts();
        });
    }

    if (sortSelect) {
        sortSelect.addEventListener('change', (event) => {
            currentSort = event.target.value || 'newest';
            loadPosts();
        });
    }

    if (myPostsToggle) {
        const updateMyPostsToggle = () => {
            myPostsToggle.setAttribute('aria-pressed', showMyPostsOnly ? 'true' : 'false');
            if (showMyPostsOnly) {
                myPostsToggle.classList.remove('bg-gray-700', 'hover:bg-gray-600', 'text-gray-200', 'border-gray-600');
                myPostsToggle.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'border-blue-500', 'shadow-lg');
                myPostsToggle.textContent = 'Showing My Posts';
            } else {
                myPostsToggle.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'border-blue-500', 'shadow-lg');
                myPostsToggle.classList.add('bg-gray-700', 'hover:bg-gray-600', 'text-gray-200', 'border-gray-600');
                myPostsToggle.textContent = 'My Posts';
            }
        };

        updateMyPostsToggle();
        if (!isAuthenticated) {
            myPostsToggle.classList.add('opacity-60', 'cursor-not-allowed');
        }

        myPostsToggle.addEventListener('click', () => {
            if (!isAuthenticated) {
                showToast('Please log in to view your posts', true);
                return;
            }
            showMyPostsOnly = !showMyPostsOnly;
            updateMyPostsToggle();
            loadPosts();
        });
    }

    // Load posts
    async function loadPosts() {
        const params = new URLSearchParams();
        if (currentLeague) {
            params.set('league', currentLeague);
        }
        if (currentSort) {
            params.set('sort', currentSort);
        }
        if (showMyPostsOnly) {
            params.set('mine', 'true');
        }
        const query = params.toString();
        const url = query ? `${listUrl}?${query}` : listUrl;
        try {
            const response = await fetch(url, { credentials: 'include' });
            const result = await response.json();
            displayPosts(result.data || []);
        } catch (error) {
            console.error('Error loading posts:', error);
            document.getElementById('posts-list').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-red-400">Error loading posts. Please try again.</p>
                </div>
            `;
        }
    }

    function buildDetailUrl(postId) {
        if (!detailTemplate) {
            return `/forum/posts/${postId}/`;
        }
        if (detailTemplate.endsWith('/0/')) {
            return detailTemplate.replace('/0/', `/${postId}/`);
        }
        if (detailTemplate.endsWith('0/')) {
            return `${detailTemplate.slice(0, -2)}${postId}/`;
        }
        if (detailTemplate.endsWith('/0')) {
            return detailTemplate.replace('/0', `/${postId}`);
        }
        if (detailTemplate.endsWith('0')) {
            return `${detailTemplate.slice(0, -1)}${postId}`;
        }
        return `${detailTemplate}${postId}`;
    }

    // Display posts
    function displayPosts(posts) {
        const postsList = document.getElementById('posts-list');
        
        if (posts.length === 0) {
            postsList.innerHTML = `
                <div class="text-center py-12">
                    <p class="text-gray-400">No posts yet. Be the first to create one!</p>
                </div>
            `;
            return;
        }

        postsList.innerHTML = posts.map(post => {
            const date = new Date(post.created_at);
            const timeAgo = getTimeAgo(date);
            const leagueNames = {
                'EPL': 'Premier League',
                'LALIGA': 'La Liga',
                'SERIEA': 'Serie A',
                'BUNDES': 'Bundesliga',
                'LIGUE1': 'Ligue 1'
            };
            const avatarUrl = resolveAvatar(post.author, post.avatar);
            
            const actionButtons = post.is_author ? `
                <div class="absolute top-3 right-3 flex gap-2">
                    <button onclick="event.stopPropagation(); openEditModalForPost(${post.id})" 
                            class="p-2 bg-gray-700 hover:bg-blue-600 rounded-lg transition-colors group"
                            title="Edit post">
                        <svg class="w-4 h-4 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </button>
                    <button onclick="event.stopPropagation(); deletePost(${post.id})" 
                            class="p-2 bg-gray-700 hover:bg-red-600 rounded-lg transition-colors group"
                            title="Delete post">
                        <svg class="w-4 h-4 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            ` : '';
            
            return `
                <div onclick="window.location.href = buildDetailUrl(${post.id})" class="relative bg-gray-800 border border-gray-700 rounded-lg p-5 hover:border-blue-500 transition-all duration-300 cursor-pointer hover:shadow-lg hover:shadow-blue-500/20">
                    ${actionButtons}
                    <div class="flex items-start gap-3">
                        <img src="${avatarUrl}" alt="${post.author}" class="flex-shrink-0 w-10 h-10 rounded-full object-cover border border-blue-500/40" loading="lazy" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author || 'User')}';">
                        <div class="flex-1 min-w-0 pr-20">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="font-semibold text-gray-200">${post.author}</span>
                                <span class="text-gray-500">&middot;</span>
                                <span class="text-xs px-2 py-1 bg-blue-500/20 text-blue-400 rounded-full">${leagueNames[post.league]}</span>
                                <span class="text-gray-500">&middot;</span>
                                <span class="text-sm text-gray-400">${timeAgo}</span>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2 hover:text-blue-400 transition-colors">${escapeHtml(post.title)}</h3>
                            <p class="text-gray-300 mb-3 line-clamp-3">${escapeHtml(post.content)}</p>
                            <div class="flex items-center gap-4 text-sm text-gray-400">
                                <div class="flex items-center gap-1">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
                                    </svg>
                                    <span>${post.comment_count} comments</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Create post
    document.getElementById('createPostForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const league = document.getElementById('postLeague').value;
        
        if (!title || !content) {
            showToast('Please fill in all fields', true);
            return;
        }
        
        try {
            const response = await fetch(createUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ title, content, league })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showToast('Post created successfully!');
                closeCreateModal();
                loadPosts();
            } else {
                showToast(result.error || 'Error creating post', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error creating post', true);
        }
    });

    // Helper functions
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        const intervals = {
            year: 31536000,
            month: 2592000,
            week: 604800,
            day: 86400,
            hour: 3600,
            minute: 60
        };
        
        for (const [key, value] of Object.entries(intervals)) {
            const interval = Math.floor(seconds / value);
            if (interval >= 1) {
                return interval === 1 ? `1 ${key} ago` : `${interval} ${key}s ago`;
            }
        }
        return 'just now';
    }

    async function openEditModalForPost(postId) {
        try {
            const response = await fetch(`/forum/api/posts/${postId}/`, {
                credentials: 'include'
            });
            const result = await response.json();
            if (response.ok && result.data) {
                openEditModal(result.data);
            } else {
                showToast('Error loading post details', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error loading post details', true);
        }
    }

    // Edit post
    document.getElementById('editPostForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const postId = document.getElementById('editPostId').value;
        const title = document.getElementById('editPostTitle').value.trim();
        const content = document.getElementById('editPostContent').value.trim();
        const league = document.getElementById('editPostLeague').value;
        
        if (!title || !content) {
            showToast('Please fill in all fields', true);
            return;
        }
        
        try {
            const response = await fetch(`/forum/api/posts/${postId}/update/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({_method: "PATCH", post_id: postId, title, content, league })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showToast('Post updated successfully!');
                closeEditModal();
                loadPosts();
            } else {
                showToast(result.error || 'Error updating post', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error updating post', true);
        }
    });

    async function deletePost(postId) {
        if (!confirm("Are you sure you want to delete this post?")) return;
        try {
            const response = await fetch(`/forum/api/posts/${postId}/delete/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrftoken
                },
                credentials: "include",
                body: JSON.stringify({_method: "DELETE" ,post_id: postId })
            });
            const result = await response.json();
            if (response.ok) {
                showToast("Post deleted successfully!");
                loadPosts();
            } else {
                showToast(result.error || "Error deleting post", true);
            }
        } catch (error) {
            showToast("Error deleting post", true);
        }
    }

    // Load posts on page load
    loadPosts();
</script>

{% endblock %}
