<div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div class="relative w-full md:max-w-xs">
                <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-slate-400">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-4.35-4.35M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
                    </svg>
                </span>
                <input id="forum-search" type="search" placeholder="Search discussions"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-600 transition focus:border-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-200" />
            </div>
            <div class="hidden">
                <select id="league-filter" aria-hidden="true">
                    <option value="">All Leagues</option>
                    <option value="EPL">Premier League</option>
                    <option value="LALIGA">La Liga</option>
                    <option value="SERIEA">Serie A</option>
                    <option value="BUNDES">Bundesliga</option>
                    <option value="LIGUE1">Ligue 1</option>
                </select>
                <select id="sort-order" aria-hidden="true">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <p class="mb-2 text-xs font-medium uppercase tracking-wide text-slate-400">Leagues</p>
                <div class="flex flex-wrap gap-2" id="league-chip-group">
                    <button type="button" data-league=""
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-900 bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-xl transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="true">
                        All
                    </button>
                    <button type="button" data-league="EPL"
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        Premier League
                    </button>
                    <button type="button" data-league="LALIGA"
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        La Liga
                    </button>
                    <button type="button" data-league="SERIEA"
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        Serie A
                    </button>
                    <button type="button" data-league="BUNDES"
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        Bundesliga
                    </button>
                    <button type="button" data-league="LIGUE1"
                        class="league-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        Ligue 1
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Sort by</p>
                <div class="flex flex-wrap gap-2" id="sort-chip-group">
                    <button type="button" data-sort="newest"
                        class="sort-chip inline-flex items-center gap-2 rounded-2xl border border-slate-900 bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-xl transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="true">
                        Newest
                    </button>
                    <button type="button" data-sort="oldest"
                        class="sort-chip inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
                        aria-pressed="false">
                        Oldest
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
