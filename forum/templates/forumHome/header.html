<header class="flex flex-col gap-6 md:flex-row md:items-start md:justify-between">
    <div class="space-y-2">
        <h1 class="text-3xl font-semibold text-slate-900 md:text-4xl">Football Discussion Forum</h1>
        <p class="max-w-xl text-base text-slate-500 md:text-lg">
            Join the conversation about your favorite teams and players.
        </p>
    </div>
    <div class="flex flex-wrap items-center gap-3 md:justify-end">
        {% if request.user.is_authenticated and request.user.profile and request.user.profile.role == 'admin' %}
        <a href="{% url 'adminpanel:dashboard' %}"
            class="inline-flex items-center gap-2 rounded-2xl border border-slate-300 bg-white px-5 py-2 text-sm font-medium text-slate-600 transition hover:border-slate-400 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
            </svg>
            Manage Forum
        </a>
        {% endif %}
        <!-- Notification Button -->
        <button type="button" id="notif-btn"
            class="relative inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-5 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200"
            onclick="openNotifModal()">
            <svg class="h-5 w-5 text-slate-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14V11a6 6 0 10-12 0v3c0 .538-.214 1.055-.595 1.595L4 17h5m6 0a3 3 0 11-6 0h6z" />
            </svg>
            Notifications
            <!-- 🔴 dot indicator -->
            <span id="notif-dot" class="absolute top-1 right-1 h-2.5 w-2.5 rounded-full bg-rose-500 hidden"></span>
        </button>
        <button type="button" id="my-posts-toggle" aria-pressed="false"
            class="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-5 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 10h.01M12 10h.01M16 10h.01M21 16v-5a2 2 0 0 0-2-2h-1l-1-3a2 2 0 0 0-1.89-1.368H9.89A2 2 0 0 0 8 6L7 9H6a2 2 0 0 0-2 2v5" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 19h14" />
            </svg>
            My Posts
        </button>
        <button type="button" onclick="openCreateModal()"
            class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-6 py-2.5 text-sm font-semibold text-white shadow-lg transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-300">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m7-7H5" />
            </svg>
            New Post
        </button>
    </div>
</header>
