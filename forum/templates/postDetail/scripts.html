<script>
    const isAuthenticated = ("{{ request.user.is_authenticated|yesno:'true,false' }}" === "true");
    const postId = "{{ post_id }}";
    const postUrl = "{% url 'get_post_by_id' post_id %}";
    const commentsUrl = "{% url 'get_post_comment' post_id %}";
    const createCommentUrl = "{% url 'create_comment' post_id %}";
    const editCommentModal = document.getElementById('editCommentModal');
    const deleteCommentModal = document.getElementById('deleteCommentModal');
    const editCommentForm = document.getElementById('editCommentForm');
    const editCommentTextarea = document.getElementById('editCommentContent');
    const commentCache = new Map();
    let currentPost = null;
    let editCommentTargetId = null;
    let deleteCommentTargetId = null;
    const profileTemplate = "{% url 'users:profile' 'USERNAME_PLACEHOLDER' %}";

    function resolveAvatar(name, provided) {
        if (provided) {
            return provided;
        }
        const fallbackName = (name || 'User').trim() || 'User';
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(fallbackName)}`;
    }

    function buildProfileUrl(username) {
        const safeName = (username || '').trim();
        return profileTemplate.replace('USERNAME_PLACEHOLDER', encodeURIComponent(safeName || ''));
    }

    // Get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Toast function
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toastMessage.textContent = message;

        if (isError) {
            toast.classList.remove('bg-slate-900/95'); replyModal
            toast.classList.add('bg-rose-500');
        } else {
            toast.classList.remove('bg-rose-500');
            toast.classList.add('bg-slate-900/95');
        }

        toast.classList.remove('hidden');
        toast.classList.add('flex');

        setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
        }, 3000);
    }

    // Reply Modal functions
    function openReplyModal(parentId) {
        document.getElementById('replyParentId').value = parentId;
        document.getElementById('replyModal').classList.remove('hidden');
        document.getElementById('replyModal').classList.add('flex');
    }

    function closeReplyModal() {
        document.getElementById('replyModal').classList.add('hidden');
        document.getElementById('replyModal').classList.remove('flex');
        document.getElementById('replyForm').reset();
    }

    function openEditCommentModal(commentId) {
        const data = commentCache.get(commentId);
        if (!data) {
            showToast('Unable to load comment for editing', true);
            return;
        }
        editCommentTargetId = commentId;
        if (editCommentTextarea) {
            editCommentTextarea.value = data.content || '';
        }
        if (editCommentModal) {
            editCommentModal.classList.remove('hidden');
            editCommentModal.classList.add('flex');
        }
    }

    function closeEditCommentModal() {
        if (editCommentModal) {
            editCommentModal.classList.add('hidden');
            editCommentModal.classList.remove('flex');
        }
        editCommentTargetId = null;
        if (editCommentTextarea) {
            editCommentTextarea.value = '';
        }
    }

    function openDeleteCommentModal(commentId) {
        deleteCommentTargetId = commentId;
        if (deleteCommentModal) {
            deleteCommentModal.classList.remove('hidden');
            deleteCommentModal.classList.add('flex');
        }
    }

    function closeDeleteCommentModal() {
        if (deleteCommentModal) {
            deleteCommentModal.classList.add('hidden');
            deleteCommentModal.classList.remove('flex');
        }
        deleteCommentTargetId = null;
    }

    async function submitEditComment(event) {
        event.preventDefault();
        if (!editCommentTargetId) {
            closeEditCommentModal();
            showToast('No comment selected for editing', true);
            return;
        }
        const newContent = (editCommentTextarea.value || '').trim();
        if (!newContent) {
            showToast('Comment cannot be empty', true);
            return;
        }
        try {
            const response = await fetch(`/forum/api/comments/${editCommentTargetId}/update/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({
                    _method: 'PATCH',
                    post_id: postId,
                    comment_id: editCommentTargetId,
                    content: newContent
                })
            });
            const result = await response.json();
            if (response.ok) {
                showToast('Comment updated successfully!');
                closeEditCommentModal();
                loadComments();
            } else {
                showToast(result.error || 'Error updating comment', true);
            }
        } catch (error) {
            console.error('Error updating comment:', error);
            showToast('Error updating comment', true);
        }
    }

    async function confirmDeleteComment() {
        if (!deleteCommentTargetId) {
            closeDeleteCommentModal();
            showToast('No comment selected for deletion', true);
            return;
        }
        try {
            const response = await fetch(`/forum/api/comments/${deleteCommentTargetId}/delete/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({
                    _method: 'DELETE',
                    post_id: postId,
                    comment_id: deleteCommentTargetId
                })
            });
            const result = await response.json();
            if (response.ok) {
                showToast('Comment deleted successfully!');
                closeDeleteCommentModal();
                loadComments();
                loadPost();
            } else {
                showToast(result.error || 'Error deleting comment', true);
            }
        } catch (error) {
            console.error('Error deleting comment:', error);
            showToast('Error deleting comment', true);
        }
    }

    function updateDetailPostLike(button, liked, count) {
        if (!button) return;
        const countValue = Number.isFinite(count) ? count : 0;
        button.dataset.liked = liked ? 'true' : 'false';
        button.dataset.count = String(countValue);
        button.classList.remove('text-rose-500', 'text-slate-500');
        button.classList.add(liked ? 'text-rose-500' : 'text-slate-500');
        const icon = button.querySelector('svg');
        if (icon) {
            icon.classList.remove('text-rose-500', 'text-slate-400');
            icon.classList.add(liked ? 'text-rose-500' : 'text-slate-400');
        }
        const countSpan = button.querySelector('.post-like-count');
        if (countSpan) countSpan.textContent = countValue;
    }

    async function toggleDetailPostLike(event) {
        event.preventDefault();
        event.stopPropagation();
        if (!isAuthenticated) {
            showToast('Please log in to like posts', true);
            return;
        }
        const button = event.currentTarget;
        try {
            const response = await fetch(`/forum/api/posts/${postId}/likes/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ _method: 'PATCH', post_id: postId })
            });
            const result = await response.json();
            if (response.ok) {
                const liked = !!result.liked;
                const count = result.like_count ?? 0;
                updateDetailPostLike(button, liked, count);
                if (currentPost) {
                    currentPost.is_liked = liked;
                    currentPost.like_count = count;
                }
            } else {
                showToast(result.error || 'Error updating like', true);
            }
        } catch (error) {
            console.error('Error updating like:', error);
            showToast('Error updating like', true);
        }
    }

    function updateCommentLikeButton(button, liked, count) {
        if (!button) return;
        const countValue = Number.isFinite(count) ? count : 0;
        button.dataset.liked = liked ? 'true' : 'false';
        button.dataset.count = String(countValue);
        button.classList.remove('text-rose-500', 'text-slate-500');
        button.classList.add(liked ? 'text-rose-500' : 'text-slate-500');
        const icon = button.querySelector('svg');
        if (icon) {
            icon.classList.remove('text-rose-500', 'text-slate-400');
            icon.classList.add(liked ? 'text-rose-500' : 'text-slate-400');
        }
        const countSpan = button.querySelector('.comment-like-count');
        if (countSpan) countSpan.textContent = countValue;
    }


    async function toggleCommentLike(event, commentId) {
        event.preventDefault();
        event.stopPropagation();
        if (!isAuthenticated) {
            showToast('Please log in to like comments', true);
            return;
        }
        const button = event.currentTarget;
        try {
            const response = await fetch(`/forum/api/comments/${commentId}/likes/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({
                    _method: 'PATCH',
                    post_id: postId,
                    comment_id: commentId
                })
            });
            const result = await response.json();
            if (response.ok) {
                const liked = !!result.liked;
                const count = result.like_count ?? 0;
                updateCommentLikeButton(button, liked, count);
                const cacheEntry = commentCache.get(commentId);
                if (cacheEntry) {
                    cacheEntry.like_count = count;
                    cacheEntry.is_liked = liked;
                }
            } else {
                showToast(result.error || 'Error updating like', true);
            }
        } catch (error) {
            console.error('Error updating comment like:', error);
            showToast('Error updating like', true);
        }
    }

    async function loadPost() {
        try {
            const response = await fetch(postUrl, { credentials: 'include' });
            if (!response.ok) {
                throw new Error('Failed to load post');
            }
            const result = await response.json();
            if (!result || !result.data) {
                throw new Error('Invalid post payload');
            }
            displayPost(result.data);
        } catch (error) {
            console.error('Error loading post:', error);
            document.getElementById('post-detail').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-red-500">Error loading post. Please try again.</p>
                </div>
            `;
        }
    }

    function buildDetailUrl(postId) {
        return detailTemplate.replace("0/", `${postId}/`);
    }

    function extractYouTubeId(rawUrl) {
        if (!rawUrl) return null;
        try {
            const u = new URL(rawUrl, window.location.origin);

            // youtu.be/<id>
            if (u.hostname.includes('youtu.be')) {
                const id = u.pathname.slice(1).split('/')[0];
                return /^[A-Za-z0-9_-]{6,}$/.test(id) ? id : null;
            }

            // youtube.com/shorts/<id>
            if (u.hostname.includes('youtube.com') && u.pathname.startsWith('/shorts/')) {
                const id = u.pathname.split('/')[2] || '';
                return /^[A-Za-z0-9_-]{6,}$/.test(id) ? id : null;
            }

            // youtube.com/watch?v=<id> (v bisa tidak urutan pertama)
            if (u.hostname.includes('youtube.com') && u.pathname === '/watch') {
                const v = u.searchParams.get('v');
                return /^[A-Za-z0-9_-]{6,}$/.test(v || '') ? v : null;
            }

            // youtube.com/embed/<id>
            if (u.hostname.includes('youtube.com') && u.pathname.startsWith('/embed/')) {
                const id = u.pathname.split('/')[2] || '';
                return /^[A-Za-z0-9_-]{6,}$/.test(id) ? id : null;
            }

            return null;
        } catch {
            // fallback regex ringan kalau URL() gagal
            const m = rawUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/);
            return m ? m[1] : null;
        }
    }

    function buildYouTubeSrc(videoId, { useApi = false } = {}) {
        const base = `https://www.youtube-nocookie.com/embed/${videoId}`;
        const params = new URLSearchParams({
            rel: '0',
            modestbranding: '1',
            playsinline: '1',
        });
        if (useApi) {
            params.set('enablejsapi', '1');
            params.set('origin', window.location.origin); // penting saat enablejsapi
        }
        return `${base}?${params.toString()}`;
    }


    function renderYouTubeEmbedOrFallback(videoId) {
        const src = buildYouTubeSrc(videoId, { useApi: false });
        // Kartu dengan iframe + fallback link (jaga-jaga kalau error/153)
        return `
      <div class="my-2">
        <div class="relative w-full aspect-video overflow-hidden rounded-2xl border border-slate-200">
          <iframe
            src="${src}"
            class="absolute inset-0 h-full w-full"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
        <div class="mt-2 text-xs text-slate-500">
          Jika video tidak bisa diputar (mis. error 153), buka langsung di YouTube:
          <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" class="text-blue-600 underline">https://youtu.be/${videoId}</a>
        </div>
      </div>
    `;
    }

    function displayPost(post) {
        const date = new Date(post.created_at);
        const timeAgo = getTimeAgo(date);
        const leagueNames = {
            'EPL': 'Premier League',
            'LALIGA': 'La Liga',
            'SERIEA': 'Serie A',
            'BUNDES': 'Bundesliga',
            'LIGUE1': 'Ligue 1'
        };
        const leagueLabel = leagueNames[post.league] || 'General';
        const isLiked = !!post.is_liked
        currentPost = { ...post };
        const likeCount = post.like_count || 0;
        const likeButtonClass = post.is_liked ? 'text-blue-600' : 'text-gray-500';
        const likeIconClass = post.is_liked ? 'text-blue-600' : 'text-gray-400';
        const profileUrl = buildProfileUrl(post.author);

        const mediaHTML = (() => {
            const urlCandidates = [
                post.media_url,
                post.mediaUrl,
                (post.media && post.media.url),
            ].filter(Boolean);

            const url = urlCandidates[0];
            if (!url) return '';
            const ytId = extractYouTubeId(url);
            if (ytId) {
                return renderYouTubeEmbedOrFallback(ytId);
            }

            const vimeo = url.match(/vimeo\.com\/(\d+)/);
            if (vimeo && vimeo[1]) {
                return `
            <iframe
              src="https://player.vimeo.com/video/${vimeo[1]}"
              class="w-full aspect-video rounded-2xl border border-slate-200 my-2"
              allowfullscreen loading="lazy"></iframe>`;
            }

            if (/\.(mp4|webm|ogg|mov|m4v|avi|mkv)$/i.test(url)) {
                return `
            <video controls class="w-full rounded-2xl border border-slate-200 max-h-96 my-2">
              <source src="${url}">
              Your browser does not support the video tag.
            </video>`;
            }

            if (/^\/media\//.test(url)) {
                return `
            <img src="${url}" alt="media"
                class="rounded-2xl border border-slate-200 w-full max-h-96 object-cover my-2"
                loading="lazy">`;
            }

            const likelyImageHost = /gstatic\.com|googleusercontent\.com|ggpht\.com|fbcdn\.net|twimg\.com|pinimg\.com|cdninstagram\.com/i.test(url);
            const looksLikeImage =
                /^data:image\//i.test(url) ||
                /\.(avif|webp|png|jpe?g|gif|bmp|svg)$/i.test(url) ||
                likelyImageHost ||
                /^\/media\//.test(url); // lokal MEDIA

            if (looksLikeImage) {
                const escaped = url.replace(/"/g, '&quot;');
                return `
            <div class="media-wrapper my-2">
              <img
                src="${escaped}"
                alt="media"
                class="rounded-2xl border border-slate-200 w-full max-h-96 object-cover"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.nextElementSibling.classList.remove('hidden'); this.remove();">
              <a href="${escaped}" target="_blank" class="media-fallback hidden text-blue-600 underline break-all">${escaped}</a>
            </div>`;
            }

            // 8) Fallback: link biasa
            return `<a href="${url}" target="_blank" class="text-blue-600 underline break-all my-2 inline-block">${url}</a>`;
        })();
        document.getElementById('post-detail').innerHTML = `
            <div class="flex items-start gap-4">
                <a href="${profileUrl}" onclick="event.stopPropagation();" class="flex-shrink-0">
                    <img src="${resolveAvatar(post.author, post.avatar)}" alt="${post.author}" class="w-12 h-12 rounded-full object-cover border border-blue-200" loading="lazy" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author || 'User')}';">
                </a>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-3">
                        <a href="${profileUrl}" onclick="event.stopPropagation();" class="font-semibold text-gray-900 hover:text-blue-600 transition-colors">${post.author}</a>
                        <span class="text-gray-400">&middot;</span>
                        <span class="rounded-full border border-slate-200 bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">${leagueLabel}</span>
                        <span class="text-gray-400">&middot;</span>
                        <span class="text-sm text-gray-500">${timeAgo}</span>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-4">${escapeHtml(post.title)}</h1>
                    ${mediaHTML}
                    <p class="text-gray-700 text-base leading-relaxed whitespace-pre-wrap">${escapeHtml(post.content)}</p>
                    <div class="mt-4 flex items-center gap-4 text-sm text-gray-500">
                    <button type="button"
                    class="like-button inline-flex items-center gap-1 rounded-full border border-transparent px-2 py-1 text-sm font-medium ${post.is_liked ? 'text-rose-500' : 'text-slate-500'} transition hover:text-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-200"
                    data-post-id="${post.id}"
                    data-liked="${post.is_liked}"
                    data-count="${likeCount}"
                    onclick="toggleDetailPostLike(event)">
                    <svg class="h-5 w-5 ${post.is_liked ? 'text-rose-500' : 'text-slate-400'} transition"
                        viewBox="0 0 24 24" fill="${post.is_liked ? 'currentColor' : 'none'}"
                        stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 1 1 6.364 6.364L12 21.682l-7.682-8.682a4.5 4.5 0 0 1 0-6.364z" />
                    </svg>
                    <span class="post-like-count">${likeCount}</span>
                    </button>
                        <div class="flex items-center gap-1">
                            <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h6m-5 8 4-4h4a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1z" />
                            </svg>
                            <span>${post.comment_count || 0} comments</span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const commentTotal = post.comment_count || 0;
        document.getElementById('comment-count').textContent = `${commentTotal} comments`;
    }

    // Load comments
    async function loadComments() {
        try {
            const response = await fetch(commentsUrl, { credentials: 'include' });
            if (!response.ok) {
                throw new Error('Failed to load comments');
            }
            const result = await response.json();
            displayComments((result && result.data) || []);
        } catch (error) {
            console.error('Error loading comments:', error);
            document.getElementById('comments-list').innerHTML = `
                <div class="text-center py-8">
                    <p class="text-red-500">Error loading comments.</p>
                </div>
            `;
        }
    }

    // Display comments
    function renderComment(comment, depth = 0) {
        const date = new Date(comment.created_at);
        const timeAgo = getTimeAgo(date);
        const indentClass = depth > 0 ? 'ml-8 border-l border-gray-200 pl-6' : '';
        const hasReplies = Array.isArray(comment.replies) && comment.replies.length > 0;
        const likeCount = comment.like_count || 0;
        const likeButtonClass = comment.is_liked ? 'text-blue-600' : 'text-gray-500';
        const likeIconClass = comment.is_liked ? 'text-blue-600' : 'text-gray-400';
        const profileUrl = buildProfileUrl(comment.user);
        commentCache.set(comment.id, {
            content: comment.content,
            like_count: likeCount,
            is_liked: !!comment.is_liked,
        });

        const childHtml = hasReplies
            ? `
                <div class="mt-3">
                    <button type="button"
                            id="toggle-btn-${comment.id}"
                            onclick="toggleReplies(${comment.id})"
                            class="text-xs uppercase tracking-wide text-gray-700 hover:text-black font-semibold">
                        Hide replies (${comment.replies.length})
                    </button>
                </div>
                <div id="replies-${comment.id}" data-count="${comment.replies.length}" class="mt-4 space-y-4">
                    ${comment.replies.map(child => renderComment(child, depth + 1)).join('')}
                </div>
            `
            : '';

        const likeButton = `
            <button type="button"
                onclick="toggleCommentLike(event, ${comment.id})"
                class="like-button inline-flex items-center gap-1 rounded-full border border-transparent px-2 py-1 text-sm font-medium ${comment.is_liked ? 'text-rose-500' : 'text-slate-500'} transition hover:text-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-200"
                data-comment-id="${comment.id}"
                data-liked="${comment.is_liked ? 'true' : 'false'}"
                data-count="${likeCount}">
                <svg class="h-5 w-5 ${comment.is_liked ? 'text-rose-500' : 'text-slate-400'} transition"
                    viewBox="0 0 24 24"
                    fill="${comment.is_liked ? 'currentColor' : 'none'}"
                    stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 1 1 6.364 6.364L12 21.682l-7.682-8.682a4.5 4.5 0 0 1 0-6.364z" />
                </svg>
                <span class="comment-like-count">${likeCount}</span>
            </button>
            `;


        const ownerActions = comment.is_owner ? `
            <button type="button"
                    onclick="openEditCommentModal(${comment.id})"
                    class="rounded-2xl border border-slate-200 bg-white/70 p-2 text-slate-500 transition hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-200">
                <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-.879-9.121a2.121 2.121 0 1 1 3 3L13 15l-4 1 1-4 7.121-7.121z" />
                </svg>
            </button>
            <button type="button"
                    onclick="openDeleteCommentModal(${comment.id})"
                    class="rounded-2xl border border-rose-100 bg-rose-50/70 p-2 text-rose-500 transition hover:border-rose-200 hover:text-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-200">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12m-1 0-1 12H8L7 7m3 0V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2" />
            </svg>
            </button>
        ` : '';

        return `
            <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm ${indentClass}">
                <div class="flex items-start gap-3">
                    <a href="${profileUrl}" onclick="event.stopPropagation();" class="flex-shrink-0">
                        <img src="${resolveAvatar(comment.user, comment.avatar)}" alt="${comment.user}" class="w-10 h-10 rounded-full object-cover border border-blue-200" loading="lazy" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(comment.user || 'User')}';">
                    </a>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <a href="${profileUrl}" onclick="event.stopPropagation();" class="font-semibold text-gray-900 hover:text-blue-600 transition-colors">${comment.user}</a>
                            <span class="text-gray-400">&middot;</span>
                            <span class="text-sm text-gray-500">${timeAgo}</span>
                        </div>
                        <p class="text-gray-700 mb-3 whitespace-pre-wrap">${escapeHtml(comment.content)}</p>
                        <div class="flex items-center flex-wrap gap-3 text-sm text-gray-500">
                            ${likeButton}
                        <button type="button" onclick="openReplyModal(${comment.id})" 
                            class="text-black hover:text-gray-700 font-medium inline-flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                    d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                            </svg>
                            Reply
                        </button>
                            ${ownerActions}
                        </div>
                        ${childHtml}
                    </div>
                </div>
            </div>
        `;
    }

    function displayComments(comments) {
        const commentsList = document.getElementById('comments-list');
        commentCache.clear();

        if (!comments || comments.length === 0) {
            commentsList.innerHTML = `
                <div class="text-center py-8">
                    <p class="text-gray-500">No comments yet. Be the first to comment!</p>
                </div>
            `;
            return;
        }

        commentsList.innerHTML = comments.map(comment => renderComment(comment)).join('');
    }

    function toggleReplies(commentId) {
        const container = document.getElementById(`replies-${commentId}`);
        const button = document.getElementById(`toggle-btn-${commentId}`);
        if (!container || !button) {
            return;
        }
        const hidden = container.classList.toggle('hidden');
        const count = container.dataset.count || container.children.length;
        button.textContent = hidden ? `Show replies (${count})` : `Hide replies (${count})`;
    }
    // Add comment
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const content = document.getElementById('commentContent').value.trim();

        if (!content) {
            showToast('Please enter a comment', true);
            return;
        }

        try {
            const response = await fetch(createCommentUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ content })
            });

            const result = await response.json();

            if (response.ok) {
                showToast('Comment added successfully!');
                document.getElementById('commentContent').value = '';
                loadComments();
                loadPost(); // Reload post to update comment count
            } else {
                showToast(result.error || 'Error adding comment', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error adding comment', true);
        }
    });

    // Add reply
    document.getElementById('replyForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const content = document.getElementById('replyContent').value.trim();
        const parentId = document.getElementById('replyParentId').value;

        if (!content) {
            showToast('Please enter a reply', true);
            return;
        }

        try {
            const response = await fetch(createCommentUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'include',
                body: JSON.stringify({ content, parent_id: parentId })
            });

            const result = await response.json();

            if (response.ok) {
                showToast('Reply added successfully!');
                closeReplyModal();
                loadComments();
                loadPost();
            } else {
                showToast(result.error || 'Error adding reply', true);
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Error adding reply', true);
        }
    });

    if (editCommentForm) {
        editCommentForm.addEventListener('submit', submitEditComment);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        const intervals = {
            year: 31536000,
            month: 2592000,
            week: 604800,
            day: 86400,
            hour: 3600,
            minute: 60
        };

        for (const [key, value] of Object.entries(intervals)) {
            const interval = Math.floor(seconds / value);
            if (interval >= 1) {
                return interval === 1 ? `1 ${key} ago` : `${interval} ${key}s ago`;
            }
        }
        return 'just now';
    }

    loadPost();
    loadComments();
</script>
