<section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
  <header class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Discussion</h2>
      <p class="text-sm text-slate-500">Join the conversation and share your thoughts.</p>
    </div>
    <span id="comment-count" class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-400"></span>
  </header>

  <form id="commentForm" class="mb-6 space-y-3 rounded-3xl border border-slate-200 bg-slate-50/70 p-5">
    <label for="commentContent" class="text-xs font-semibold uppercase tracking-wide text-slate-400">Add a comment</label>
    <textarea id="commentContent" rows="4" placeholder="Share your thoughts..." class="w-full resize-none rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-700 placeholder-slate-400 transition focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200"></textarea>
    <div class="flex justify-end">
      <button type="submit" class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white shadow-md transition hover:bg-slate-800">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        Post Comment
      </button>
    </div>
  </form>

  <div id="comments-list" class="space-y-4">
    <div class="rounded-3xl border border-slate-200 bg-slate-50 py-10 text-center text-slate-500">
      Loading comments...
    </div>
  </div>
</section>
