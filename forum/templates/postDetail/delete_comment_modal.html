<!-- Delete Comment Modal -->
<div id="deleteCommentModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/70 p-4 backdrop-blur-sm">
    <div class="w-full max-w-md overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl">
        <div class="px-6 py-6">
            <h3 class="text-lg font-semibold text-slate-900">Delete Comment</h3>
            <p class="mt-2 text-sm text-slate-500">Are you sure you want to delete this comment? This action cannot be
                undone.</p>
            <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
                <button type="button" onclick="closeDeleteCommentModal()"
                    class="inline-flex items-center justify-center rounded-2xl border border-slate-200 px-5 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-900">
                    Cancel
                </button>
                <button type="button" onclick="confirmDeleteComment()"
                    class="inline-flex items-center justify-center rounded-2xl bg-rose-500 px-6 py-2 text-sm font-semibold text-white shadow-md transition hover:bg-rose-400">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>
