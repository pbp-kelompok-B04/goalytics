<div class="p-6">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-bold text-slate-900">Add {{ player.name }} to a Squad</h1>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
    </div>

    <form id="select-squad-async-form" method="POST" action="{% url 'dream_squad:select_squad_for_player' player.id %}">
        {% csrf_token %}
        <div class="space-y-3 max-h-60 overflow-y-auto pr-2">
            {% if squads %}
                {% for squad in squads %}
                    <label class="relative flex items-center p-3 rounded-2xl border cursor-pointer transition hover:bg-slate-50 {% if squad.has_player %}opacity-60 bg-slate-100 cursor-not-allowed{% endif %}">
                        <input type="radio" name="squad_id" value="{{ squad.id }}" 
                               class="h-4 w-4 text-slate-900 focus:ring-slate-900" 
                               {% if squad.is_full or squad.has_player %}disabled{% endif %}>
                        <div class="ml-3">
                            <span class="block text-sm font-semibold text-slate-900">{{ squad.name }}</span>
                            <span class="block text-xs text-slate-500">{{ squad.player_count }}/{{ MAX_PLAYERS }} Players</span>
                        </div>
                        {% if squad.has_player %}
                            <span class="ml-auto text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">ALREADY IN</span>
                        {% elif squad.is_full %}
                            <span class="ml-auto text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold">FULL</span>
                        {% endif %}
                    </label>
                {% endfor %}
            {% else %}
                <p class="text-slate-500 text-center py-4">No squads found.</p>
            {% endif %}
        </div>

        <div id="modal-error-container" class="mt-3 text-sm text-red-500 hidden text-center font-medium"></div>

        <div class="mt-6 flex flex-col gap-2">
            {% if squads %}
            <button type="submit" id="submit-select-btn" class="w-full py-3 rounded-2xl bg-slate-900 text-white font-bold hover:bg-slate-800 transition active:scale-95">
                Add to Squad
            </button>
            {% endif %}
            <button type="button" onclick="closeModal()" class="w-full py-3 text-sm font-semibold text-slate-500 hover:text-slate-800">
                Cancel
            </button>
        </div>
    </form>
</div>
