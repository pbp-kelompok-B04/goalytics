{% extends 'base.html' %}
{% block title %}Delete {{ entity_label|title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-16">
  <div class="bg-white shadow rounded-xl p-8 text-center space-y-6">
    <h1 class="text-2xl font-bold text-red-600">Confirm Deletion</h1>
    <p class="text-gray-600">You are about to delete the {{ entity_label }} <strong>{{ object_name }}</strong>.</p>
    <p class="text-gray-500 text-sm">This action cannot be undone.</p>
    <form method="post" class="flex flex-col sm:flex-row justify-center gap-3 pt-4">
      {% csrf_token %}
      <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-500 transition">
        Yes, delete
      </button>
      <a href="{{ cancel_url }}"
         class="px-6 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
