{% extends 'base.html' %}
{% block title %}Players{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto mt-10 bg-white rounded-xl shadow-md p-8">

  <!-- Back to Database Button -->
  <div class="flex justify-between items-center mb-6">
    <a href="{% url 'PlayerClub_Data:database_home' %}"
       class="flex items-center gap-2 text-blue-800 font-semibold hover:text-blue-600 transition">
      ← Back to Database
    </a>
  </div>

  <!-- Header Title + Add Button -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-800">Player List</h1>
    {% if is_admin %}
    <a href="{% url 'PlayerClub_Data:player_create' %}"
       class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg shadow transition">
       + Add Player
    </a>
    {% endif %}
  </div>

  <!-- Player Table -->
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse" id="players-table">
      <thead>
        <tr class="bg-blue-100 text-blue-800">
          <th class="p-3">Name</th>
          <th class="p-3">Club</th>
          <th class="p-3">Position</th>
          <th class="p-3">Goals</th>
          <th class="p-3">Assists</th>
          <th class="p-3">Nation</th>
          <th class="p-3">Favorite</th> 
          {% if is_admin %}<th class="p-3">Actions</th>{% endif %}
        </tr>
      </thead>
      <tbody id="player-rows">
        <tr>
          <td colspan="7" class="text-center py-5 text-gray-500">Loading players…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('player-rows');
  const url = "{% url 'PlayerClub_Data:get_all_player' %}";
  const IS_ADMIN = "{{ is_admin|yesno:'true,false' }}" === "true";
  const editTpl = "{% url 'PlayerClub_Data:player_update' 0 %}";
  const delTpl = "{% url 'PlayerClub_Data:player_delete' 0 %}";
  const favTpl = "{% url 'favorite_player:add_favorite' 0 %}";
  const makeUrl = (tpl, id) => tpl.replace(/\/0\//, `/${id}/`);

  fetch(url, { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject(r))
    .then(payload => {
      const data = (payload && payload.data) || [];
      if (!Array.isArray(data) || data.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-gray-500">No players found.</td></tr>';
        return;
      }

      const html = data.map(p => {
        const safe = (v) => (v === null || v === undefined || v === '' ? '-' : String(v));
        const favoriteUrl = makeUrl(favTpl, p.id);
        const isFav = p.is_favorite === true;
        const favButton = isFav
          ? `<button class="bg-red-500 text-white px-3 py-1 rounded-md text-sm cursor-not-allowed opacity-80">Added</button>`
          : `<button data-id="${p.id}" data-url="${favoriteUrl}"
                    class="fav-btn bg-yellow-500 hover:bg-yellow-400 text-white px-3 py-1 rounded-md text-sm">
                    Add
             </button>`;

        let row = `<tr class="border-b hover:bg-gray-50 transition">`
          + `<td class="p-3 font-medium text-gray-800">${safe(p.name)}</td>`
          + `<td class="p-3">${safe(p.club)}</td>`
          + `<td class="p-3">${safe(p.position)}</td>`
          + `<td class="p-3">${safe(p.goals)}</td>`
          + `<td class="p-3">${safe(p.assists)}</td>`
          + `<td class="p-3">${safe(p.nation)}</td>`
          + `<td class="p-3 text-center">${favButton}</td>`;

        if (IS_ADMIN) {
          const editUrl = makeUrl(editTpl, p.id);
          const delUrl = makeUrl(delTpl, p.id);
          row += `<td class="p-3 flex gap-2">`
            + `<a href="${editUrl}" class="bg-yellow-400 hover:bg-yellow-300 text-white px-3 py-1 rounded-md text-sm">✏️</a>`
            + `<a href="${delUrl}" class="bg-red-500 hover:bg-red-400 text-white px-3 py-1 rounded-md text-sm">🗑️</a>`
            + `</td>`;
        }

        row += `</tr>`;
        return row;
      }).join('');

      rowsEl.innerHTML = html;

      // 🔧 Tambahkan event listener untuk tombol Add Favorite
      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const url = btn.dataset.url;
          btn.disabled = true;

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCSRFToken() },
            credentials: 'same-origin'
          });

          if (response.ok) {
            btn.textContent = 'Added';
            btn.classList.remove('bg-yellow-500', 'hover:bg-yellow-400');
            btn.classList.add('bg-red-500', 'cursor-not-allowed', 'opacity-80');
            btn.disabled = true;
          } else {
            btn.disabled = false;
            alert('Failed to add favorite.');
          }
        });
      });
    })
    .catch(err => {
      console.error('Failed to load players:', err);
      rowsEl.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-red-600">Failed to load players.</td></tr>';
    });

  // 🔧 Fungsi bantu ambil CSRF token dari cookie
  function getCSRFToken() {
    const name = 'csrftoken=';
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(name)) return c.substring(name.length);
    }
    return '';
  }

})();
</script>

{% endblock %}
