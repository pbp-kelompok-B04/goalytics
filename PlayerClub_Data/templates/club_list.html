{% extends 'base.html' %}
{% block title %}Clubs{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto mt-10 bg-white rounded-xl shadow-md p-8">

  <!-- Back to Database Button -->
  <div class="flex justify-between items-center mb-6">
    <a href="{% url 'PlayerClub_Data:database_home' %}"
       class="flex items-center gap-2 text-blue-800 font-semibold hover:text-blue-600 transition">
      ← Back to Database
    </a>
  </div>

  <!-- Header Title + Add Button -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-blue-800">Club List</h1>
    {% if is_admin %}
    <a href="{% url 'PlayerClub_Data:club_create' %}"
       class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg shadow transition">
       + Add Club
    </a>
    {% endif %}
  </div>

  <!-- Club Table (AJAX populated) -->
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse" id="clubs-table">
      <thead>
        <tr class="bg-blue-100 text-blue-800">
          <th class="p-3">Name</th>
          <th class="p-3">League</th>
          <th class="p-3">Country</th>
          <th class="p-3">Code</th>
        </tr>
      </thead>
      <tbody id="club-rows">
        <tr>
          <td colspan="4" class="text-center py-5 text-gray-500">Loading clubs…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script>
  (function() {
    const rowsEl = document.getElementById('club-rows');
    const url = "{% url 'PlayerClub_Data:get_all_club' %}";

    fetch(url, { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(payload => {
        const data = (payload && payload.data) || [];
        if (!Array.isArray(data) || data.length === 0) {
          rowsEl.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-gray-500">No clubs found.</td></tr>';
          return;
        }
        const html = data.map(c => {
          const safe = (v) => (v === null || v === undefined || v === '' ? '-' : String(v));
          return `<tr class=\"border-b hover:bg-gray-50 transition\">`
               + `<td class=\"p-3 font-medium text-gray-800\">${safe(c.name)}</td>`
               + `<td class=\"p-3\">${safe(c.league)}</td>`
               + `<td class=\"p-3\">${safe(c.country)}</td>`
               + `<td class=\"p-3\">${safe(c.code)}</td>`
               + `</tr>`;
        }).join('');
        rowsEl.innerHTML = html;
      })
      .catch(() => {
        rowsEl.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-red-600">Failed to load clubs.</td></tr>';
      });
  })();
  </script>
{% endblock %}
