{% extends 'base.html' %}
{% block title %}{{ action }} Club{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12 bg-white p-10 rounded-3xl shadow-xl border border-gray-100">

  <!-- Header Section -->
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">
      {{ action }} <span class="text-blue-600">Club</span>
    </h1>
  </div>

  <!-- Form Section -->
  <form method="POST" class="space-y-6">
    {% csrf_token %}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      {% for field in form %}
        <div class="relative">
          <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1">
            {% if "name" in field.name %}📜{% elif "country" in field.name %}🌍{% elif "code" in field.name %}#️⃣{% elif "stadium" in field.name %}🏟️{% endif %}
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.errors %}
            <p class="text-sm text-red-600 mt-1">{{ field.errors.as_text }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 pt-6">
      <a href="{% url 'PlayerClub_Data:club_list' %}"
         class="px-5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold transition duration-200 shadow-sm hover:shadow-md">
        Cancel
      </a>
      <button type="submit"
              class="px-6 py-2.5 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 shadow-md hover:shadow-lg hover:scale-[1.02] transition duration-200 flex items-center gap-2">
        💾 Save
      </button>
    </div>
  </form>
</div>

<!-- Custom Styling -->
<style>
  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    border: 1.5px solid #d1d5db;
    background-color: #f9fafb;
    color: #111827;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    transition: all 0.2s ease-in-out;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: #3b82f6;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    outline: none;
  }

  /* Remove unwanted divider */
  form::before {
    content: none !important;
  }
</style>
{% endblock %}
