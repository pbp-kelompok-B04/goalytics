{% extends 'base.html' %}
{% block title %}Delete Player{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg text-center">
  <h2 class="text-xl font-semibold text-red-600 mb-4">
    Are you sure you want to delete "{{ player.name }}"?
  </h2>

  <form method="POST">
    {% csrf_token %}
    <div class="flex justify-center gap-3">
      <button type="submit"
              class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-md transition">
        Yes, Delete
      </button>
      <a href="{% url 'PlayerClub_Data:player_list' %}"
         class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
