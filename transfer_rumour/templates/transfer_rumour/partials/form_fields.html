{% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-2">
      {{ field.label }}
    </label>
    {{ field }}
    {% if field.help_text %}
      <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
      <p class="text-sm text-red-600 mt-2">{{ field.errors|striptags }}</p>
    {% endif %}
  </div>
{% endfor %}
