<article class="flex h-full flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg" data-rumour-id="{{ rumour.id }}">
  {% if rumour.cover_image_url %}
    <div class="aspect-[4/3] w-full bg-slate-100">
      <img src="{{ rumour.cover_image_url }}" alt="Cover {{ rumour.title }}" class="h-full w-full object-cover object-center">
    </div>
  {% endif %}
  <div class="flex flex-1 flex-col gap-3 p-5">
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-medium uppercase tracking-wide text-slate-400">
      <span>{{ rumour.created_at|date:"j M" }}</span>
      <span>{{ rumour.author.get_full_name|default:rumour.author.username }}</span>
    </div>
    <h3 class="text-lg font-semibold text-slate-900">
      <a href="{% url 'transfer_rumour:detail' rumour.slug %}" class="hover:text-slate-600">{{ rumour.title }}</a>
    </h3>
    <p class="text-sm text-slate-600">{{ rumour.summary|default:rumour.content|truncatechars:140 }}</p>
    <div class="mt-auto pt-4">
      <a href="{% url 'transfer_rumour:detail' rumour.slug %}" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900">
        Baca selengkapnya
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
    </div>
    {% if rumour.id in manageable_ids %}
      <div class="flex items-center gap-3 text-xs font-semibold text-slate-400">
        <a href="{% url 'transfer_rumour:edit' rumour.slug %}" class="text-blue-600 hover:text-blue-700">Edit</a>
        <button type="button" data-rumour-delete data-delete-url="{% url 'transfer_rumour:delete' rumour.slug %}"
                class="text-rose-500 hover:text-rose-600">Hapus</button>
      </div>
    {% endif %}
  </div>
</article>
