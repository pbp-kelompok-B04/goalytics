{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="flex justify-center items-center h-screen bg-gray-100">
  <form method="POST" class="bg-white p-8 rounded-lg shadow-md w-96">
    {% csrf_token %}
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">Register</h2>

    {% for message in messages %}
      <p class="text-red-500 text-center mb-2">{{ message }}</p>
    {% endfor %}

    <input type="text" name="username" placeholder="Username" class="w-full p-2 mb-3 border rounded" required>
    <input type="email" name="email" placeholder="Email" class="w-full p-2 mb-3 border rounded" required>
    <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-3 border rounded" required>
    <input type="password" name="confirm" placeholder="Confirm Password" class="w-full p-2 mb-5 border rounded" required>

    <button type="submit" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 transition">Register</button>

    <p class="mt-4 text-center text-sm">Already have an account? 
      <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline">Login</a>
    </p>
  </form>
</div>
{% endblock %}
