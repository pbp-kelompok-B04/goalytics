{% extends 'base.html' %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg">
  <div class="flex flex-col md:flex-row items-center md:items-start gap-8">

    <!-- Profile Picture -->
    <div class="flex flex-col items-center w-full md:w-1/3">
      <img src="{{ profile.profile_picture|default:'https://ui-avatars.com/api/?name='|add:user.username }}" 
           alt="Profile Picture" 
           class="w-40 h-40 rounded-full border-4 border-blue-500 shadow-md mb-4">
      <h2 class="text-2xl font-bold text-blue-800">{{ user.username }}</h2>
      <p class="text-gray-500 text-sm mb-2">{{ user.email }}</p>
      <span class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium mb-4">
        {{ profile.role|title }}
      </span>
    </div>

    <!-- Profile Details + Edit Form -->
    <div class="flex-1 w-full">
      <h3 class="text-xl font-semibold text-gray-800 mb-4">Profile Information</h3>
      
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Profile Picture URL</label>
          {{ form.profile_picture }}
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Bio</label>
          {{ form.bio }}
        </div>
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-5 rounded-lg shadow transition">
          Save Changes
        </button>
      </form>

      <div class="mt-8">
        <p class="text-gray-600 text-sm">Member since {{ user.date_joined|date:"F j, Y" }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
